<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Expense Tracker</h1>
    </div>
  </header>

  <main class="container">

    <!-- Dashboard summary -->
    <section class="summary" aria-label="Summary">
      <div class="card card-income">
        <h2 class="card-label">Total Income</h2>
        <p class="card-value" id="total-income">₱ 0.00</p>
      </div>
      <div class="card card-expense">
        <h2 class="card-label">Total Expenses</h2>
        <p class="card-value" id="total-expenses">₱ 0.00</p>
      </div>    
      <div class="card card-balance">
        <h2 class="card-label">Balance</h2>
        <p class="card-value" id="balance">₱ 0.00</p>
      </div>
    </section>

    <!-- Add / edit transaction form -->
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Add Transaction</h2>

      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" placeholder="e.g. Groceries">
          <p class="error-message" id="description-error"></p>
        </div>

        <div class="form-group">
          <label for="amount">Amount</label>
          <div class="input-prefix-wrapper">
            <span class="input-prefix" aria-hidden="true">₱</span>
            <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00">
          </div>
          <p class="error-message" id="amount-error"></p>
        </div>

        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
          <p class="error-message" id="date-error"></p>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-button">Add Transaction</button>
          <button type="button" id="cancel-edit-button" hidden>Cancel Edit</button>
        </div>

      </form>
    </section>

    <!-- Transaction history -->
    <section class="panel" aria-labelledby="history-heading">
      <h2 id="history-heading">Transaction History</h2>

      <!-- Search and filters -->
      <div class="filters">
        <input type="search" id="search-input" placeholder="Search by description">

        <select id="filter-type" aria-label="Filter by type">
          <option value="all">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <select id="filter-category" aria-label="Filter by category">
          <option value="all">All categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Bills">Bills</option>
          <option value="Shopping">Shopping</option>
          <option value="Salary">Salary</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th>Category</th>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="transaction-list"></tbody>
        </table>
      </div>

      <p id="empty-message">No transactions found.</p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
