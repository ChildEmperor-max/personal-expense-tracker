<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Expense Tracker</h1>
    </div>
  </header>

  <main class="container">

    <!-- Dashboard summary -->
    <section class="summary" aria-label="Summary">
      <div class="card card-income">
        <h2 class="card-label">Total Income</h2>
        <p class="card-value" id="total-income">₱ 0.00</p>
      </div>
      <div class="card card-expense">
        <h2 class="card-label">Total Expenses</h2>
        <p class="card-value" id="total-expenses">₱ 0.00</p>
      </div>    
      <div class="card card-balance">
        <h2 class="card-label">Balance</h2>
        <p class="card-value" id="balance">₱ 0.00</p>
      </div>
    </section>
    
    <!-- Transaction form -->
    <section class="transaction-form" aria-label="Add Transaction">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" name="description" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount (₱)</label>
          <input type="number" id="amount" name="amount" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type" required>
            <option value="">Select Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <button type="submit">Add Transaction</button>
      </form>

  </main>

  <script src="script.js"></script>
</body>
</html>
